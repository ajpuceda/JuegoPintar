<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>🎨 Juego de Pintar</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: linear-gradient(150deg, #fdeec9 0%, #dceefb 60%, #cfe8f7 100%);
      overflow: hidden;
    }
    .page {
      height: 100%; max-width: 1180px; margin: 0 auto; padding: 5px 8px 7px;
      display: flex; flex-direction: column; gap: 5px; min-height: 0;
    }

    /* ---------- cabecera compacta ---------- */
    header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    h1 {
      font-size: 20px; font-weight: 800; margin: 0; color: #263238;
      background: linear-gradient(90deg, #ef6c00, #f9a825, #42a5f5);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .sub { margin: 0; color: #546e7a; font-weight: 600; font-size: 12px; }

    /* ---------- tarjetas ---------- */
    .card {
      background: rgba(255,255,255,0.92); border-radius: 12px; padding: 6px 8px;
      box-shadow: 0 3px 10px rgba(38,50,56,0.10);
    }

    /* ---------- barra de herramientas ---------- */
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    select {
      padding: 6px 8px; border-radius: 10px; border: 2px solid #e0e0e0;
      font-size: 13px; background: #fff; cursor: pointer; font-weight: 700;
      max-width: 190px; color: #263238;
    }
    select:focus { outline: none; border-color: #42a5f5; }

    /* botones de herramienta: grandes, con emoji + texto */
    .tools { display: flex; gap: 6px; flex-wrap: wrap; }
    .toolbtn {
      border: 2px solid transparent; border-radius: 12px; padding: 5px 9px;
      font-size: 12px; font-weight: 700; cursor: pointer; color: #37474f;
      background: #f1f4f6; display: flex; flex-direction: column; align-items: center;
      gap: 2px; min-width: 60px; transition: transform .12s, background .12s, box-shadow .12s;
    }
    .toolbtn .ico { font-size: 20px; line-height: 1; }
    .toolbtn:hover { transform: translateY(-2px); background: #e3ebf2; }
    .toolbtn.active {
      background: linear-gradient(160deg, #42a5f5, #1e88e5); color: #fff;
      box-shadow: 0 3px 8px rgba(30,136,229,0.45); transform: translateY(-2px);
    }

    .sizewrap { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 13px; color: #37474f; }
    input[type="range"] { cursor: pointer; width: 90px; }
    #sizeVal { min-width: 20px; text-align: center; }

    .actions { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
    .abtn {
      border: none; border-radius: 12px; padding: 8px 12px; font-size: 13px;
      cursor: pointer; font-weight: 800; background: #eceff1; color: #37474f;
      transition: transform .12s, box-shadow .12s;
    }
    .abtn:hover { transform: translateY(-2px); box-shadow: 0 3px 8px rgba(0,0,0,0.12); }
    .abtn:active { transform: translateY(0); }
    .abtn.primary { background: linear-gradient(160deg, #66bb6a, #43a047); color: #fff; }
    .abtn.danger { background: linear-gradient(160deg, #ff7043, #f4511e); color: #fff; }

    /* ---------- paleta (segunda fila de la misma tarjeta) ---------- */
    .palette {
      display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
      flex-basis: 100%; padding: 4px 2px 1px; margin-top: 2px;
      border-top: 1px solid #eceff1;
    }
    .palette > span { font-weight: 800; font-size: 12px; color: #546e7a; }
    .swatch {
      width: 30px; height: 30px; border-radius: 50%; padding: 0;
      border: 2px solid rgba(255,255,255,0.9); cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.22); transition: transform .12s;
    }
    .swatch:hover { transform: scale(1.15); }
    .swatch.active { box-shadow: 0 0 0 3px #fff, 0 0 0 6px #263238; transform: scale(1.08); }
    .swatch.white { border: 2px solid #cfd8dc; }
    .palette label { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 12px; cursor: pointer; color: #546e7a; }
    input[type="color"] { width: 30px; height: 30px; border: none; background: none; cursor: pointer; padding: 0; }

    /* ---------- lienzo: se ajusta al espacio restante ---------- */
    .stagewrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
    .stage {
      position: relative; background: #fff; border-radius: 12px; overflow: hidden;
      box-shadow: 0 8px 24px rgba(38,50,56,0.18);
      touch-action: none; cursor: crosshair; border: 3px solid #263238;
    }
    .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .stage canvas#lines { pointer-events: none; }

    .hint { margin: 0; text-align: center; color: #546e7a; font-size: 11px; font-weight: 600; }

    @media (max-width: 720px) {
      h1 { font-size: 18px; }
      .sub { display: none; }
      .abtn { padding: 9px 11px; font-size: 13px; }
      select { max-width: 150px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>🎨 Juego de Pintar</h1>
      <p class="sub">Elige uno de los 50 dibujos y dale tu toque de color.</p>
    </header>

    <div class="toolbar card">
      <select id="animalSel" title="Dibujo"></select>
      <div class="tools" id="tools">
        <button class="toolbtn active" data-tool="pincel" title="Pincel fino"><span class="ico">🖌️</span>Pincel</button>
        <button class="toolbtn" data-tool="brocha" title="Brocha gruesa"><span class="ico">🧹</span>Brocha</button>
        <button class="toolbtn" data-tool="spray" title="Aerógrafo"><span class="ico">💨</span>Spray</button>
        <button class="toolbtn" data-tool="relleno" title="Rellenar región"><span class="ico">🪄</span>Rellenar</button>
        <button class="toolbtn" data-tool="borrador" title="Borrador"><span class="ico">🧽</span>Borrador</button>
      </div>
      <div class="sizewrap" id="sizeLabel">
        <input type="range" id="sizeRange" min="1" max="60" value="5" />
        <span id="sizeVal">5</span>
      </div>
      <div class="actions">
        <button id="undoBtn" class="abtn" title="Deshacer">↩️ Deshacer</button>
        <button id="clearBtn" class="abtn danger" title="Limpiar">🗑️ Limpiar</button>
        <button id="saveBtn" class="abtn primary" title="Guardar PNG">💾 Guardar PNG</button>
      </div>
      <div class="palette" id="palette">
        <span>Colores</span>
        <label title="Color personalizado">
          <input type="color" id="customColor" value="#e53935" />
        </label>
      </div>
    </div>

    <div class="stagewrap" id="stagewrap">
      <div class="stage" id="stage">
        <canvas id="paint" width="900" height="640"></canvas>
        <canvas id="lines" width="900" height="640"></canvas>
      </div>
    </div>

    <p class="hint">💡 Con <b>Rellenar</b>, un clic dentro de una zona la pinta entera sin salirse de las líneas.</p>
  </div>

  <script src="dibujos.js"></script>
  <script>
  (function () {
    "use strict";
    var W = 900, H = 640;
    var COLORS = [
      "#e53935", "#ff7043", "#ffb300", "#fdd835", "#aed581", "#66bb6a",
      "#26a69a", "#4dd0e1", "#42a5f5", "#5c6bc0", "#ab47bc", "#ec407a",
      "#8d6e63", "#cfd8dc", "#212121", "#ffffff"
    ];
    var TOOL_DEFAULT = { pincel: 5, brocha: 28, spray: 32, borrador: 24 };

    var stage = document.getElementById("stage");
    var stagewrap = document.getElementById("stagewrap");
    var paint = document.getElementById("paint");
    var lines = document.getElementById("lines");
    var pctx = paint.getContext("2d");
    var lctx = lines.getContext("2d");
    var palette = document.getElementById("palette");
    var sizeRange = document.getElementById("sizeRange");
    var sizeVal = document.getElementById("sizeVal");
    var sizeLabel = document.getElementById("sizeLabel");

    var animal = "gato", tool = "pincel", color = "#e53935", size = 5;
    var linesData = null;
    var history = [];
    var drawing = false;
    var last = null;

    /* ---- ajustar el lienzo al espacio disponible (todo en una pantalla) ---- */
    function fitStage() {
      var r = stagewrap.getBoundingClientRect();
      var s = Math.min((r.width - 4) / W, (r.height - 4) / H);
      if (s <= 0) return;
      stage.style.width = Math.floor(W * s) + "px";
      stage.style.height = Math.floor(H * s) + "px";
    }
    window.addEventListener("resize", fitStage);
    window.addEventListener("orientationchange", fitStage);
    if (window.ResizeObserver) new ResizeObserver(fitStage).observe(stagewrap);
    fitStage();

    function hexToRgb(hex) {
      var n = parseInt(hex.slice(1), 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }

    function loadAnimal(a) {
      animal = a;
      lctx.clearRect(0, 0, W, H);
      DIBUJOS.drawOps(lctx, DIBUJOS.get(a).ops);
      linesData = lctx.getImageData(0, 0, W, H);
      pctx.fillStyle = "#ffffff";
      pctx.fillRect(0, 0, W, H);
      history = [];
    }

    function snapshot() {
      history.push(pctx.getImageData(0, 0, W, H));
      if (history.length > 15) history.shift();
    }

    function floodFill(x, y, hex) {
      if (x < 0 || y < 0 || x >= W || y >= H || !linesData) return;
      var img = pctx.getImageData(0, 0, W, H);
      var d = img.data, ld = linesData.data;
      var start = y * W + x;
      var i0 = start * 4;
      var tr = d[i0], tg = d[i0 + 1], tb = d[i0 + 2];
      var rgb = hexToRgb(hex);
      var fr = rgb[0], fg = rgb[1], fb = rgb[2];
      if (Math.abs(tr - fr) < 6 && Math.abs(tg - fg) < 6 && Math.abs(tb - fb) < 6) return;
      var tol = 30;
      var seen = new Uint8Array(W * H);
      seen[start] = 1;
      var stack = [start];
      function match(pi) {
        var i = pi * 4;
        return Math.abs(d[i] - tr) <= tol && Math.abs(d[i + 1] - tg) <= tol && Math.abs(d[i + 2] - tb) <= tol;
      }
      while (stack.length) {
        var pi = stack.pop();
        if (ld[pi * 4 + 3] > 40) continue;
        var i = pi * 4;
        d[i] = fr; d[i + 1] = fg; d[i + 2] = fb; d[i + 3] = 255;
        var px = pi % W;
        if (px > 0 && !seen[pi - 1] && match(pi - 1)) { seen[pi - 1] = 1; stack.push(pi - 1); }
        if (px < W - 1 && !seen[pi + 1] && match(pi + 1)) { seen[pi + 1] = 1; stack.push(pi + 1); }
        if (pi >= W && !seen[pi - W] && match(pi - W)) { seen[pi - W] = 1; stack.push(pi - W); }
        if (pi < W * H - W && !seen[pi + W] && match(pi + W)) { seen[pi + W] = 1; stack.push(pi + W); }
      }
      pctx.putImageData(img, 0, 0);
    }

    function pos(e) {
      var r = stage.getBoundingClientRect();
      return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
    }

    function strokeColor() {
      return tool === "borrador" ? "#ffffff" : color;
    }

    stage.addEventListener("pointerdown", function (e) {
      e.preventDefault();
      var p = pos(e);
      snapshot();
      if (tool === "relleno") {
        floodFill(Math.floor(p.x), Math.floor(p.y), color);
        return;
      }
      stage.setPointerCapture(e.pointerId);
      drawing = true;
      last = p;
      pctx.lineCap = "round";
      pctx.lineJoin = "round";
      pctx.strokeStyle = strokeColor();
      pctx.lineWidth = size;
      pctx.beginPath();
      pctx.moveTo(p.x, p.y);
      pctx.lineTo(p.x + 0.01, p.y);
      pctx.stroke();
    });

    stage.addEventListener("pointermove", function (e) {
      if (!drawing) return;
      var p = pos(e);
      if (tool === "spray") {
        pctx.fillStyle = color;
        pctx.globalAlpha = 0.3;
        for (var i = 0; i < 14; i++) {
          var a = Math.random() * Math.PI * 2;
          var dist = Math.random() * size;
          pctx.fillRect(p.x + Math.cos(a) * dist, p.y + Math.sin(a) * dist, 2, 2);
        }
        pctx.globalAlpha = 1;
      } else {
        pctx.strokeStyle = strokeColor();
        pctx.lineWidth = size;
        pctx.beginPath();
        pctx.moveTo(last.x, last.y);
        pctx.lineTo(p.x, p.y);
        pctx.stroke();
      }
      last = p;
    });

    function stopDraw() { drawing = false; }
    stage.addEventListener("pointerup", stopDraw);
    stage.addEventListener("pointercancel", stopDraw);
    stage.addEventListener("contextmenu", function (e) { e.preventDefault(); });

    document.getElementById("undoBtn").addEventListener("click", function () {
      var img = history.pop();
      if (img) pctx.putImageData(img, 0, 0);
    });

    document.getElementById("clearBtn").addEventListener("click", function () {
      snapshot();
      pctx.fillStyle = "#ffffff";
      pctx.fillRect(0, 0, W, H);
    });

    document.getElementById("saveBtn").addEventListener("click", function () {
      var t = document.createElement("canvas");
      t.width = W; t.height = H;
      var tc = t.getContext("2d");
      tc.fillStyle = "#ffffff";
      tc.fillRect(0, 0, W, H);
      tc.drawImage(paint, 0, 0);
      tc.drawImage(lines, 0, 0);
      var a = document.createElement("a");
      a.download = "juego-pintar-" + animal + ".png";
      a.href = t.toDataURL("image/png");
      a.click();
    });

    document.getElementById("animalSel").addEventListener("change", function (e) {
      loadAnimal(e.target.value);
    });

    /* botones de herramienta (grandes, un clic) */
    var toolBtns = document.querySelectorAll(".toolbtn");
    Array.prototype.forEach.call(toolBtns, function (b) {
      b.addEventListener("click", function () {
        tool = b.getAttribute("data-tool");
        Array.prototype.forEach.call(toolBtns, function (x) { x.classList.remove("active"); });
        b.classList.add("active");
        if (TOOL_DEFAULT[tool]) {
          size = TOOL_DEFAULT[tool];
          sizeRange.value = size;
          sizeVal.textContent = size;
        }
        sizeLabel.style.display = tool === "relleno" ? "none" : "flex";
      });
    });

    sizeRange.addEventListener("input", function (e) {
      size = Number(e.target.value);
      sizeVal.textContent = size;
    });

    var customColor = document.getElementById("customColor");
    customColor.addEventListener("input", function (e) {
      color = e.target.value;
      clearActive();
    });

    function clearActive() {
      var all = palette.querySelectorAll(".swatch");
      for (var i = 0; i < all.length; i++) all[i].classList.remove("active");
    }

    COLORS.forEach(function (c) {
      var b = document.createElement("button");
      b.className = "swatch" + (c === color ? " active" : "") + (c === "#ffffff" ? " white" : "");
      b.title = c;
      b.style.background = c;
      b.addEventListener("click", function () {
        color = c;
        customColor.value = c;
        clearActive();
        b.classList.add("active");
      });
      palette.insertBefore(b, customColor.parentNode);
    });

    var sel = document.getElementById("animalSel");
    DIBUJOS.CATS.forEach(function (cat) {
      var og = document.createElement("optgroup");
      og.label = cat[1];
      DIBUJOS.ids().forEach(function (id) {
        var d = DIBUJOS.get(id);
        if (d.cat === cat[0]) {
          var op = document.createElement("option");
          op.value = id;
          op.textContent = d.n;
          og.appendChild(op);
        }
      });
      sel.appendChild(og);
    });

    loadAnimal("gato");
    fitStage();
  })();
  </script>
</body>
</html>
